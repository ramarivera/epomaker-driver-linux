name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --prefix ui
      - run: npm run format:check --prefix ui
      - run: npm run build --prefix ui
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: python -m pytest --cov=epomaker_driver --cov-branch --cov-report=term-missing --cov-fail-under=98
      - run: python -m build
      - run: npx --prefix ui playwright install --with-deps chromium
        if: matrix.python == '3.14'
      - run: npm test --prefix ui
        if: matrix.python == '3.14'
        env:
          EPOMAKER_TEST_PYTHON: python
