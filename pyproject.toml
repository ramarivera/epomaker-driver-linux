[build-system]
requires = ["setuptools==82.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "epomaker-driver-linux"
version = "0.1.0"
description = "Independent Linux configuration software for EPOMAKER HID devices"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow==12.3.0"]
license = "MIT"
authors = [{name = "Ramiro Rivera"}]
classifiers = ["Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3"]

[project.scripts]
epomaker = "epomaker_driver.cli:main"

[project.optional-dependencies]
dev = ["pytest==9.0.2", "pytest-cov==7.0.0", "ruff==0.15.1", "build==1.4.0"]

[tool.setuptools.package-data]
epomaker_driver = ["data/*.json", "web/*", "web/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["hardware: requires an explicitly selected physical device"]

[tool.coverage.run]
branch = true
source = ["epomaker_driver"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
